<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الاتصالات الإدارية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif; background: #F7F8FA; color: #1E2A38; font-size: 15px; direction: rtl; }
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: #EDF0F5; }
::-webkit-scrollbar-thumb { background: #B0BAC8; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #8090A8; }

/* ===== LAYOUT ===== */
#app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* ===== TOP BAR ===== */
#topbar {
  display: flex; align-items: center; justify-content: space-between;
  background: #1A3A4A; padding: 0 22px; height: 68px; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}
.topbar-brand { display: flex; align-items: center; gap: 10px; color: #fff; }
.topbar-brand .icon { font-size: 24px; color: #A0C8E0; }
.topbar-brand .title { font-size: 19px; font-weight: 700; letter-spacing: 0.3px; }
.topbar-date { font-size: 15px; font-weight: 600; color: #C9E2EC; padding: 0 20px; }
.topbar-actions { display: flex; gap: 8px; }
.btn-close-sys {
  background: #D64045; color: #fff; border: none; padding: 10px 14px;
  border-radius: 7px; cursor: pointer; font-size: 14px; font-weight: 700;
  font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 7px;
  transition: background .2s;
}
.btn-close-sys:hover { background: #B03035; }

/* ===== MAIN AREA ===== */
#main { display: flex; flex: 1; overflow: hidden; }

/* ===== SIDEBAR ===== */
#sidebar {
  width: 210px; background: #1A3A4A; display: flex; flex-direction: column;
  flex-shrink: 0; padding-top: 16px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 13px 18px;
  color: #BFCDD8; cursor: pointer; font-size: 14.5px; font-weight: 600;
  transition: background .18s, color .18s; border-right: 3px solid transparent;
  user-select: none;
}
.nav-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
.nav-item.active { background: #1A6B8A; color: #fff; border-right-color: #5AC8EE; }
.nav-item .nav-icon { font-size: 16px; flex-shrink: 0; }
.sidebar-spacer { flex: 1; }
.sidebar-close { margin: 0 14px 8px; width: calc(100% - 28px); }
.sidebar-ver { padding: 12px 18px; font-size: 11px; color: #4A6070; text-align: center; }

/* ===== CONTENT ===== */
#content { flex: 1; overflow-y: auto; padding: 22px 24px; background: #F7F8FA; }

/* ===== PAGE HEADER ===== */
.page-title { font-size: 24px; font-weight: 700; color: #1E2A38; margin-bottom: 18px; }

/* ===== TABS ===== */
.tabs { display: flex; gap: 6px; margin-bottom: 16px; }
.tab-btn {
  padding: 9px 20px; border: none; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-weight: 700; font-family: inherit;
  transition: background .18s, color .18s; display: flex; align-items: center; gap: 7px;
}
.tab-btn.out { background: #EAF4F8; color: #1A6B8A; }
.tab-btn.out.active { background: #1A6B8A; color: #fff; }
.tab-btn.in { background: #EAF7F1; color: #2EAD7A; }
.tab-btn.in.active { background: #2EAD7A; color: #fff; }

/* ===== TOOLBAR ===== */
.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar-right { margin-right: auto; }
.rec-count { font-size: 13px; color: #6B7A8D; background: #EDF0F5; padding: 5px 12px; border-radius: 20px; }

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
  border: none; border-radius: 7px; cursor: pointer; font-size: 14px; font-weight: 700;
  font-family: inherit; transition: background .18s, transform .1s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: #1A6B8A; color: #fff; }
.btn-primary:hover { background: #145570; }
.btn-success { background: #2EAD7A; color: #fff; }
.btn-success:hover { background: #258F64; }
.btn-danger { background: #D64045; color: #fff; }
.btn-danger:hover { background: #B03035; }
.btn-neutral { background: #EDF0F5; color: #1E2A38; }
.btn-neutral:hover { background: #D5DCE6; }
.btn-warning { background: #E8A838; color: #fff; }
.btn-warning:hover { background: #C8902A; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ===== TABLE ===== */
.table-wrap { background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #D5DCE6; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead tr { background: #1A3A4A; color: #fff; }
thead th { padding: 11px 14px; font-weight: 700; font-size: 13.5px; text-align: center; white-space: nowrap; }
tbody tr { transition: background .1s; cursor: pointer; }
tbody tr:nth-child(even) { background: #F2F6FA; }
tbody tr:nth-child(odd) { background: #fff; }
tbody tr:hover { background: #EAF4F8; }
tbody tr.selected { background: #C8E6F5 !important; }
tbody td { padding: 10px 14px; border-bottom: 1px solid #EDF0F5; text-align: center; vertical-align: middle; }
tbody td.td-subject { text-align: right; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tbody td.td-notes { text-align: right; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #6B7A8D; font-size: 12px; }
.empty-state { text-align: center; padding: 48px 20px; color: #6B7A8D; font-size: 15px; }
.empty-state .empty-icon { font-size: 40px; margin-bottom: 10px; opacity: .5; }

/* ===== SEARCH SCREEN ===== */
.filter-card {
  background: #fff; border-radius: 10px; border: 1px solid #D5DCE6;
  padding: 20px 22px; margin-bottom: 18px;
}
.filter-section-title {
  font-size: 13px; font-weight: 700; color: #1A6B8A; margin-bottom: 14px;
  padding-bottom: 8px; border-bottom: 1px solid #EAF4F8;
  display: flex; align-items: center; gap: 7px;
}
.filter-grid { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: flex-end; }
.filter-field { display: flex; flex-direction: column; gap: 5px; min-width: 160px; }
.filter-field label { font-size: 12px; font-weight: 700; color: #1E2A38; }
.type-selector { display: flex; gap: 12px; margin-bottom: 18px; }
.type-radio { display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: 13px; font-weight: 700; }
.type-radio input { cursor: pointer; accent-color: #1A6B8A; transform: scale(1.2); }
.type-radio.out { color: #1A6B8A; }
.type-radio.in { color: #2EAD7A; }

/* ===== FORM INPUTS ===== */
.form-input, .form-textarea, .form-select {
  width: 100%; padding: 8px 11px; border: 1.5px solid #D5DCE6; border-radius: 7px;
  font-family: inherit; font-size: 13px; color: #1E2A38; background: #fff;
  outline: none; transition: border-color .18s, box-shadow .18s; direction: rtl;
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
  border-color: #1A6B8A; box-shadow: 0 0 0 3px rgba(26,107,138,0.12);
}
.form-textarea { resize: vertical; min-height: 80px; }
.form-input.error { border-color: #D64045; }
.field-hint { font-size: 11px; color: #6B7A8D; margin-top: 3px; }
.hijri-date-grid {
  display: grid; grid-template-columns: 0.8fr 1.35fr 1fr; gap: 10px;
  direction: rtl;
}
.hijri-date-part { display: flex; flex-direction: column; gap: 5px; }
.hijri-date-part > span { font-size: 12px; font-weight: 600; color: #6B7A8D; }
.hijri-date-part .form-select { height: 39px; cursor: pointer; }

/* ===== MODAL OVERLAY ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(10,24,34,0.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
  animation: fadeIn .18s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.modal-box {
  background: #fff; border-radius: 14px; width: 100%; max-width: 560px;
  overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  animation: slideUp .2s ease;
  max-height: 90vh; display: flex; flex-direction: column;
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 22px; color: #fff;
}
.modal-header.out-header { background: #1A6B8A; }
.modal-header.in-header { background: #2EAD7A; }
.modal-header-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 9px; }
.modal-close-btn {
  background: rgba(255,255,255,0.18); border: none; color: #fff;
  width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
  font-size: 16px; display: flex; align-items: center; justify-content: center;
  transition: background .18s;
}
.modal-close-btn:hover { background: rgba(255,255,255,0.32); }
.modal-body { padding: 22px 24px; overflow-y: auto; flex: 1; }
.modal-footer {
  padding: 14px 24px; background: #F7F8FA; border-top: 1px solid #EDF0F5;
  display: flex; gap: 10px; justify-content: flex-end;
}
.form-row { margin-bottom: 16px; }
.form-row label { display: block; font-size: 13px; font-weight: 700; color: #1E2A38; margin-bottom: 6px; }
.form-row label .required { color: #D64045; margin-right: 3px; }

/* ===== CONFIRM DIALOG ===== */
.confirm-box {
  background: #fff; border-radius: 14px; width: 100%; max-width: 420px;
  overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  animation: slideUp .2s ease;
}
.confirm-header { padding: 18px 22px 0; }
.confirm-icon { font-size: 36px; text-align: center; margin-bottom: 10px; }
.confirm-title { font-size: 17px; font-weight: 700; color: #1E2A38; text-align: center; margin-bottom: 8px; }
.confirm-msg { font-size: 13.5px; color: #6B7A8D; text-align: center; line-height: 1.7; padding: 0 10px 18px; }
.confirm-footer { padding: 0 22px 22px; display: flex; gap: 10px; justify-content: center; }

/* ===== TOAST ===== */
#toast-container { position: fixed; bottom: 24px; left: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
.toast {
  background: #1A3A4A; color: #fff; padding: 12px 20px; border-radius: 10px;
  font-size: 13px; font-weight: 600; box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  display: flex; align-items: center; gap: 10px; min-width: 220px;
  animation: slideToast .3s ease; opacity: 1; transition: opacity .3s;
}
@keyframes slideToast { from { transform: translateX(-30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.toast.success { border-right: 4px solid #2EAD7A; }
.toast.error   { border-right: 4px solid #D64045; }
.toast.info    { border-right: 4px solid #1A6B8A; }
.toast-icon { font-size: 18px; }

/* ===== BADGE ===== */
.badge-out { background: #EAF4F8; color: #1A6B8A; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.badge-in  { background: #EAF7F1; color: #2EAD7A; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; }

/* ===== SECTION HEADER ===== */
.section-hdr { background: #EAF4F8; padding: 8px 14px; border-radius: 7px; font-size: 13px; font-weight: 700; color: #1A6B8A; margin-bottom: 14px; display: flex; align-items: center; gap: 7px; }

/* ===== PRINT ===== */
@media print {
  #topbar, #sidebar, .toolbar, .tabs { display: none !important; }
  #content { padding: 0; }
  .table-wrap { border: 1px solid #ccc; }
}

/* ===== LOADING ===== */
.loading-screen {
  position: fixed; inset: 0; background: #1A3A4A;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 9999; color: #fff;
}
.loading-title { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
.loading-sub { font-size: 14px; color: #A0C8E0; }
.spinner {
  width: 44px; height: 44px; border: 4px solid rgba(255,255,255,0.15);
  border-top-color: #5AC8EE; border-radius: 50%;
  animation: spin 0.8s linear infinite; margin-bottom: 22px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

     JAVASCRIPT

<script>
'use strict';

/* ─── HIJRI CALENDAR ─── */
const HIJRI_MONTHS = ['محرم','صفر','ربيع الأول','ربيع الثاني','جمادى الأولى','جمادى الثانية','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
const E2A = s => String(s).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const A2E = s => String(s).replace(/[٠١٢٣٤٥٦٧٨٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));

function gregorianToJD(y, m, d) {
  const a = Math.floor((14 - m) / 12);
  const yr = y + 4800 - a, mr = m + 12 * a - 3;
  return d + Math.floor((153 * mr + 2) / 5) + 365 * yr + Math.floor(yr / 4) - Math.floor(yr / 100) + Math.floor(yr / 400) - 32045;
}
function jdToHijri(jd) {
  let l = jd - 1948440 + 10632;
  const n = Math.floor((l - 1) / 10631);
  l = l - 10631 * n + 354;
  const j = Math.floor((10985 - l) / 5316) * Math.floor((50 * l) / 17719) + Math.floor(l / 5670) * Math.floor((43 * l) / 15238);
  l = l - Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) - Math.floor(j / 16) * Math.floor((15238 * j) / 43) + 29;
  const mo = Math.floor((24 * l) / 709);
  const da = l - Math.floor((709 * mo) / 24);
  const yr = 30 * n + j - 30;
  return { day: da, month: mo, year: yr };
}
function getTodayHijri() {
  const t = new Date();
  return jdToHijri(gregorianToJD(t.getFullYear(), t.getMonth() + 1, t.getDate()));
}
function fmtHijri(day, month, year) {
  return `${E2A(String(day).padStart(2,'0'))}-${E2A(String(month).padStart(2,'0'))}-${E2A(year)}`;
}
function todayHijriStr() {
  const h = getTodayHijri();
  return fmtHijri(h.day, h.month, h.year);
}
function validateHijri(s) {
  const w = A2E(s);
  const p = w.split('-');
  if (p.length !== 3) return false;
  const [d, m, y] = p.map(Number);
  return d >= 1 && d <= 30 && m >= 1 && m <= 12 && y >= 1200 && y <= 1600;
}

function parseHijriParts(value) {
  const today = getTodayHijri();
  const parts = A2E(value || '').replace(/\//g, '-').split('-').map(Number);
  if (parts.length !== 3) return today;
  const [day, month, year] = parts;
  if (day < 1 || day > 30 || month < 1 || month > 12 || year < 1400 || year > 1500) return today;
  return { day, month, year };
}

function numberOptions(from, to, selected, pad = false) {
  let html = '';
  for (let n = from; n <= to; n++) {
    const value = pad ? String(n).padStart(2, '0') : String(n);
    html += `<option value="${value}" ${n === selected ? 'selected' : ''}>${E2A(value)}</option>`;
  }
  return html;
}

function monthOptions(selected) {
  return HIJRI_MONTHS.map((name, index) => {
    const month = index + 1;
    const value = String(month).padStart(2, '0');
    return `<option value="${value}" ${month === selected ? 'selected' : ''}>${E2A(value)} — ${name}</option>`;
  }).join('');
}

/* ─── INDEXEDDB ─── */
const DB_NAME = 'AdminComm_v1', DB_VER = 1;
let db;

function initDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('outgoing')) {
        const s = db.createObjectStore('outgoing', { keyPath: 'id', autoIncrement: true });
        s.createIndex('number',   'number',   { unique: false });
        s.createIndex('date',     'date_hijri', { unique: false });
        s.createIndex('recipient','recipient', { unique: false });
      }
      if (!db.objectStoreNames.contains('incoming')) {
        const s = db.createObjectStore('incoming', { keyPath: 'id', autoIncrement: true });
        s.createIndex('number', 'number',    { unique: false });
        s.createIndex('date',   'date_hijri', { unique: false });
        s.createIndex('sender', 'sender',    { unique: false });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(); };
    req.onerror   = e => reject(e.target.error);
  });
}

function dbGetAll(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = e => resolve(e.target.result.reverse());
    req.onerror   = e => reject(e.target.error);
  });
}
function dbAdd(store, obj) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).add({ ...obj, created_at: new Date().toISOString() });
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}
function dbPut(store, obj) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(obj);
    req.onsuccess = () => resolve();
    req.onerror   = e => reject(e.target.error);
  });
}
function dbDelete(store, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).delete(id);
    req.onsuccess = () => resolve();
    req.onerror   = e => reject(e.target.error);
  });
}
function dbSearch(store, filters) {
  return dbGetAll(store).then(rows => {
    return rows.filter(r => {
      const partyKey = store === 'outgoing' ? 'recipient' : 'sender';
      if (filters.number  && !r.number.includes(A2E(filters.number))  && !r.number.includes(filters.number))  return false;
      if (filters.party   && !(r[partyKey]||'').includes(filters.party))  return false;
      if (filters.subject && !(r.subject||'').includes(filters.subject))  return false;
      if (filters.from) {
        const fw = A2E(filters.from), rw = A2E(r.date_hijri||'');
        if (rw && fw && rw < fw) return false;
      }
      if (filters.to) {
        const tw = A2E(filters.to), rw = A2E(r.date_hijri||'');
        if (rw && tw && rw > tw) return false;
      }
      return true;
    });
  });
}

/* ─── APP STATE ─── */
let currentScreen   = 'transactions';
let currentTab      = 'outgoing';
let selectedTxId    = null;
let selectedSrchId  = null;
let editingRecord   = null;
let searchResults   = [];

/* ─── SCREENS ─── */
function showScreen(name) {
  currentScreen = name;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.screen === name);
  });
  const content = document.getElementById('content');
  const tpl = document.getElementById(`tpl-${name}`);
  content.innerHTML = '';
  content.appendChild(tpl.content.cloneNode(true));
  if (name === 'transactions') {
    currentTab = currentTab || 'outgoing';
    activateTab(currentTab);
    loadTransactions();
  }
}

/* ─── TRANSACTIONS SCREEN ─── */
function switchTab(tab) {
  currentTab = tab;
  selectedTxId = null;
  activateTab(tab);
  loadTransactions();
}

function activateTab(tab) {
  const tabOut = document.getElementById('tabOut');
  const tabIn  = document.getElementById('tabIn');
  if (!tabOut || !tabIn) return;
  tabOut.classList.toggle('active', tab === 'outgoing');
  tabIn.classList.toggle('active',  tab === 'incoming');
  renderTxHead(tab);
}

function renderTxHead(tab) {
  const head = document.getElementById('txHead');
  if (!head) return;
  const partyCol = tab === 'outgoing' ? 'الجهة المستقبِلة' : 'الجهة المرسِلة';
  head.innerHTML = `<tr>
    <th style="width:50px">#</th>
    <th>رقم المعاملة</th>
    <th>التاريخ الهجري</th>
    <th>${partyCol}</th>
    <th style="min-width:200px">الموضوع</th>
    <th>ملاحظات</th>
  </tr>`;
}

async function loadTransactions() {
  selectedTxId = null;
  updateTxButtons();
  const rows = await dbGetAll(currentTab);
  renderTxRows(rows);
  const c = document.getElementById('txCount');
  if (c) c.textContent = `إجمالي السجلات: ${E2A(rows.length)}`;
}

function renderTxRows(rows) {
  const body = document.getElementById('txBody');
  if (!body) return;
  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">📂</div>لا توجد معاملات مسجلة بعد</div></td></tr>`;
    return;
  }
  const partyKey = currentTab === 'outgoing' ? 'recipient' : 'sender';
  body.innerHTML = rows.map((r, i) => `
    <tr data-id="${r.id}" onclick="selectTxRow(this, ${r.id})">
      <td>${E2A(i + 1)}</td>
      <td>${esc(r.number)}</td>
      <td>${esc(r.date_hijri)}</td>
      <td>${esc(r[partyKey] || '')}</td>
      <td class="td-subject" title="${esc(r.subject)}">${esc(r.subject)}</td>
      <td class="td-notes" title="${esc(r.notes||'')}">${esc(r.notes || '—')}</td>
    </tr>`).join('');
}

function selectTxRow(tr, id) {
  document.querySelectorAll('#txBody tr').forEach(r => r.classList.remove('selected'));
  tr.classList.add('selected');
  selectedTxId = id;
  updateTxButtons();
}

function updateTxButtons() {
  const bEdit = document.getElementById('btnEdit');
  const bDel  = document.getElementById('btnDel');
  if (bEdit) bEdit.disabled = !selectedTxId;
  if (bDel)  bDel.disabled  = !selectedTxId;
}

async function deleteSelected() {
  if (!selectedTxId) return;
  showConfirm('هل أنت متأكد من حذف هذه المعاملة؟', async () => {
    await dbDelete(currentTab, selectedTxId);
    selectedTxId = null;
    await loadTransactions();
    showToast('تم حذف المعاملة بنجاح', 'success');
  });
}

/* ─── SEARCH SCREEN ─── */
function onSearchTypeChange() {
  const t = getSearchType();
  const lbl = document.getElementById('srchPartyLabel');
  if (lbl) lbl.textContent = t === 'outgoing' ? 'الجهة المستقبِلة' : 'الجهة المرسِلة';
  clearSearchResults();
}

function getSearchType() {
  const r = document.querySelector('input[name="srchType"]:checked');
  return r ? r.value : 'outgoing';
}

async function doSearch() {
  const t = getSearchType();
  selectedSrchId = null;
  updateSrchButtons();

  const filters = {
    number:  document.getElementById('srchNumber')?.value.trim() || '',
    party:   document.getElementById('srchParty')?.value.trim()  || '',
    subject: document.getElementById('srchSubject')?.value.trim()|| '',
    from:    document.getElementById('srchFrom')?.value.trim()   || '',
    to:      document.getElementById('srchTo')?.value.trim()     || '',
  };

  searchResults = await dbSearch(t, filters);
  renderSearchResults(t, searchResults);

  const c = document.getElementById('srchCount');
  if (c) c.textContent = `نتائج البحث: ${E2A(searchResults.length)} سجل`;
}

function renderSearchResults(tab, rows) {
  const head = document.getElementById('srchHead');
  const body = document.getElementById('srchBody');
  if (!head || !body) return;

  const partyCol = tab === 'outgoing' ? 'الجهة المستقبِلة' : 'الجهة المرسِلة';
  head.innerHTML = `<tr>
    <th style="width:50px">#</th>
    <th>رقم المعاملة</th>
    <th>التاريخ الهجري</th>
    <th>${partyCol}</th>
    <th style="min-width:200px">الموضوع</th>
    <th>ملاحظات</th>
  </tr>`;

  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">🔍</div>لا توجد نتائج مطابقة</div></td></tr>`;
    return;
  }

  const partyKey = tab === 'outgoing' ? 'recipient' : 'sender';
  body.innerHTML = rows.map((r, i) => `
    <tr data-id="${r.id}" onclick="selectSrchRow(this, ${r.id})">
      <td>${E2A(i + 1)}</td>
      <td>${esc(r.number)}</td>
      <td>${esc(r.date_hijri)}</td>
      <td>${esc(r[partyKey] || '')}</td>
      <td class="td-subject" title="${esc(r.subject)}">${esc(r.subject)}</td>
      <td class="td-notes" title="${esc(r.notes||'')}">${esc(r.notes || '—')}</td>
    </tr>`).join('');
}

function selectSrchRow(tr, id) {
  document.querySelectorAll('#srchBody tr').forEach(r => r.classList.remove('selected'));
  tr.classList.add('selected');
  selectedSrchId = id;
  updateSrchButtons();
}

function updateSrchButtons() {
  const bE = document.getElementById('srchBtnEdit');
  const bD = document.getElementById('srchBtnDel');
  if (bE) bE.disabled = !selectedSrchId;
  if (bD) bD.disabled = !selectedSrchId;
}

function clearSearch() {
  ['srchNumber','srchParty','srchSubject','srchFrom','srchTo'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  clearSearchResults();
  const c = document.getElementById('srchCount');
  if (c) c.textContent = '';
}

function clearSearchResults() {
  selectedSrchId = null;
  searchResults = [];
  const body = document.getElementById('srchBody');
  const head = document.getElementById('srchHead');
  if (body) body.innerHTML = '';
  if (head) head.innerHTML = '';
  updateSrchButtons();
}

async function searchEditSelected() {
  if (!selectedSrchId) return;
  const t = getSearchType();
  const record = searchResults.find(r => r.id === selectedSrchId);
  if (!record) return;
  openDialog(t, record, async data => {
    const partyKey = t === 'outgoing' ? 'recipient' : 'sender';
    const updated = { ...record, number: data.number, date_hijri: data.date_hijri, [partyKey]: data.party, subject: data.subject, notes: data.notes };
    await dbPut(t, updated);
    await doSearch();
    showToast('تم تحديث المعاملة بنجاح', 'success');
  });
}

async function searchDeleteSelected() {
  if (!selectedSrchId) return;
  const t = getSearchType();
  showConfirm('هل أنت متأكد من حذف هذه المعاملة؟', async () => {
    await dbDelete(t, selectedSrchId);
    selectedSrchId = null;
    await doSearch();
    showToast('تم حذف المعاملة بنجاح', 'success');
  });
}

/* ─── ADD / EDIT DIALOG ─── */
function openAddDialog() {
  openDialog(currentTab, null, async data => {
    const partyKey = currentTab === 'outgoing' ? 'recipient' : 'sender';
    await dbAdd(currentTab, { number: data.number, date_hijri: data.date_hijri, [partyKey]: data.party, subject: data.subject, notes: data.notes });
    await loadTransactions();
    showToast('تمت إضافة المعاملة بنجاح', 'success');
  });
}

async function openEditDialog() {
  if (!selectedTxId) return;
  const rows = await dbGetAll(currentTab);
  const record = rows.find(r => r.id === selectedTxId);
  if (!record) return;
  openDialog(currentTab, record, async data => {
    const partyKey = currentTab === 'outgoing' ? 'recipient' : 'sender';
    const updated = { ...record, number: data.number, date_hijri: data.date_hijri, [partyKey]: data.party, subject: data.subject, notes: data.notes };
    await dbPut(currentTab, updated);
    await loadTransactions();
    showToast('تم تحديث المعاملة بنجاح', 'success');
  });
}

function openDialog(txType, record, onSave) {
  const isEdit    = !!record;
  const isOut     = txType === 'outgoing';
  const partyKey  = isOut ? 'recipient' : 'sender';
  const partyLbl  = isOut ? 'الجهة المستقبِلة' : 'الجهة المرسِلة';
  const headerCls = isOut ? 'out-header' : 'in-header';
  const typeLabel = isOut ? 'صادرة ↑' : 'واردة ↓';
  const headerTxt = (isEdit ? 'تعديل' : 'إضافة') + ' معاملة ' + typeLabel;
  const todayStr  = todayHijriStr();
  const selectedDate = parseHijriParts(record?.date_hijri || todayStr);

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-header ${headerCls}">
        <div class="modal-header-title">${isEdit ? '✎' : '✚'} ${headerTxt}</div>
        <button class="modal-close-btn" onclick="closeModal(this)">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label>رقم المعاملة <span class="required">*</span></label>
          <input class="form-input" id="fldNumber" value="${esc(record?.number||'')}" placeholder="أدخل رقم المعاملة">
        </div>
        <div class="form-row">
          <label>التاريخ الهجري <span class="required">*</span></label>
          <div class="hijri-date-grid" id="fldDateGroup">
            <div class="hijri-date-part">
              <span>اليوم</span>
              <select class="form-select" id="fldDay">${numberOptions(1, 30, selectedDate.day, true)}</select>
            </div>
            <div class="hijri-date-part">
              <span>الشهر</span>
              <select class="form-select" id="fldMonth">${monthOptions(selectedDate.month)}</select>
            </div>
            <div class="hijri-date-part">
              <span>السنة</span>
              <select class="form-select" id="fldYear">${numberOptions(1400, 1500, selectedDate.year)}</select>
            </div>
          </div>
          <div class="field-hint">اليوم: ${todayStr}</div>
        </div>
        <div class="form-row">
          <label>${partyLbl} <span class="required">*</span></label>
          <input class="form-input" id="fldParty" value="${esc(record?.[partyKey]||'')}" placeholder="أدخل ${partyLbl}">
        </div>
        <div class="form-row">
          <label>الموضوع <span class="required">*</span></label>
          <input class="form-input" id="fldSubject" value="${esc(record?.subject||'')}" placeholder="أدخل موضوع المعاملة">
        </div>
        <div class="form-row">
          <label>ملاحظات</label>
          <textarea class="form-textarea" id="fldNotes" placeholder="ملاحظات إضافية (اختياري)">${esc(record?.notes||'')}</textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-neutral" onclick="closeModal(this)">إلغاء</button>
        <button class="btn btn-primary" id="btnSaveDialog">
          ${isEdit ? '💾 حفظ التعديلات' : '✔ حفظ المعاملة'}
        </button>
      </div>
    </div>`;

  document.body.appendChild(overlay);

  overlay.querySelector('#btnSaveDialog').addEventListener('click', () => {
    const number  = document.getElementById('fldNumber')?.value.trim();
    const day     = document.getElementById('fldDay')?.value;
    const month   = document.getElementById('fldMonth')?.value;
    const year    = document.getElementById('fldYear')?.value;
    const date_h  = day && month && year ? fmtHijri(Number(day), Number(month), Number(year)) : '';
    const party   = document.getElementById('fldParty')?.value.trim();
    const subject = document.getElementById('fldSubject')?.value.trim();
    const notes   = document.getElementById('fldNotes')?.value.trim();

    if (!number)  { showFieldError('fldNumber',  'يرجى إدخال رقم المعاملة'); return; }
    if (!date_h || !validateHijri(date_h)) { showFieldError('fldDay', 'يرجى اختيار التاريخ الهجري'); return; }
    if (!party)   { showFieldError('fldParty',   `يرجى إدخال ${partyLbl}`); return; }
    if (!subject) { showFieldError('fldSubject', 'يرجى إدخال موضوع المعاملة'); return; }

    document.body.removeChild(overlay);
    onSave({ number, date_hijri: date_h, party, subject, notes: notes || '' });
  });

  overlay.addEventListener('click', e => { if (e.target === overlay) document.body.removeChild(overlay); });
  overlay.querySelector('#fldNumber')?.focus();
}

function closeModal(btn) {
  const overlay = btn.closest('.modal-overlay');
  if (overlay) document.body.removeChild(overlay);
}

function showFieldError(fieldId, msg) {
  const el = document.getElementById(fieldId);
  if (!el) return;
  el.classList.add('error');
  el.focus();
  const existing = el.parentNode.querySelector('.field-error');
  if (existing) existing.remove();
  const err = document.createElement('div');
  err.className = 'field-hint';
  err.style.color = '#D64045';
  err.textContent = '⚠ ' + msg;
  el.parentNode.insertBefore(err, el.nextSibling);
  setTimeout(() => { el.classList.remove('error'); err.remove(); }, 3500);
}

/* ─── CONFIRM DIALOG ─── */
function showConfirm(message, onConfirm) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="confirm-box">
      <div class="confirm-header">
        <div class="confirm-icon">⚠️</div>
        <div class="confirm-title">تأكيد الحذف</div>
      </div>
      <div class="confirm-msg">${message}<br><small>لا يمكن التراجع عن هذا الإجراء.</small></div>
      <div class="confirm-footer">
        <button class="btn btn-neutral" onclick="this.closest('.modal-overlay').remove()">إلغاء</button>
        <button class="btn btn-danger" id="btnConfirmYes">نعم، احذف</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#btnConfirmYes').addEventListener('click', () => {
    overlay.remove();
    onConfirm();
  });
}

/* ─── CLOSE SYSTEM ─── */
function confirmClose() {
  showConfirm('هل تريد إغلاق نظام الاتصالات الإدارية؟', () => {
    document.body.innerHTML = `
      <div style="display:flex;height:100vh;align-items:center;justify-content:center;background:#1A3A4A;color:#fff;flex-direction:column;gap:14px">
        <div style="font-size:48px">✉</div>
        <div style="font-size:20px;font-weight:700">تم إغلاق النظام بنجاح</div>
        <div style="font-size:13px;color:#A0C8E0">يمكنك إغلاق هذا التبويب أو إعادة فتح الملف لتشغيل النظام</div>
      </div>`;
  });
}

/* ─── TOAST ─── */
function showToast(msg, type = 'info') {
  const icons = { success: '✔', error: '✕', info: 'ℹ' };
  const container = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<span class="toast-icon">${icons[type]||'ℹ'}</span>${msg}`;
  container.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2800);
}

/* ─── UTILS ─── */
function esc(str) {
  return String(str||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
